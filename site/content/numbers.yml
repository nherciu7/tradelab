# Every number the copy shows through a {{token}} comes from here.
# src:    <file in site/data>:<path inside it>
# dp:     decimals shown (default 0)
# prefix / suffix: text around the number ("$", "€", "%", " bps")
# sign:   true shows "+" on positive numbers
# abs:    true drops the minus (for "down $278" style sentences)
# round:  round to a multiple first (10 turns 269.69 into 270)
# thousands: true adds a comma separator
# scale:  multiply first (0.01 turns bps into %)
# Negative numbers use a real minus sign (−).


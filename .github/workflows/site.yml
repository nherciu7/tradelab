name: site

# On every push to main: research tests, site build, Playwright QA, then deploy to GitHub Pages.
# The deploy job only runs if every test in the test job passed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # "/tradelab" for https://nherciu7.github.io/tradelab/. For a custom domain set BASE_PATH to ""
  # and SITE_URL to the domain (and add a CNAME file in site/public).
  BASE_PATH: /tradelab
  SITE_URL: https://nherciu7.github.io/tradelab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # --- research code: the stock pipeline's unit tests (synthetic data, no downloads)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: pip install -r requirements.txt
      - name: Research tests (pytest)
        run: python -m pytest -q

      # --- the site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Style scan of the Markdown copy
        working-directory: site
        run: npm run scan:copy
      - name: Build (static export)
        working-directory: site
        run: npm run build
      - name: Install Playwright's Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Playwright tests against the built site
        working-directory: site
        run: npx playwright test
      - name: Keep the test report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            site/playwright-report
            site/test-results
          retention-days: 30

      - name: Package the site for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
